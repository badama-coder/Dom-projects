<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>
      
      <div class="flex flex-1 items-center justify-center py-10">
        <div class="bg-[#19231E8C] border border-[#FFFFFF26] rounded-3xl w-[620px] p-[40px]">
          <div class="flex justify-between mb-[28px]">
            <div class="bg-[#B5CBB21A] p-[10.5px] rounded-xl">
              <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M19.1673 13.4167C19.1673 17.6508 15.7348 21.0833 11.5007 21.0833C7.26647 21.0833 3.83398 17.6508 3.83398 13.4167C3.83398 9.18248 7.26647 5.75 11.5007 5.75C15.7348 5.75 19.1673 9.18248 19.1673 13.4167Z" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
<path d="M11.5 9.58341V13.4167L13.4167 15.3334M8.625 1.91675H11.5M11.5 1.91675H14.375M11.5 1.91675V5.75008M17.25 6.70841L19.1667 4.79175" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
</svg>
            </div>
            <div id="message" class="flex items-center justify-center h-[29px] px-3 text-[#C5D9BD] text-xs font-medium bg-[#B5CBB20D] border border-[#C5D9BD26]  rounded-[99px]">Ready</div>
          </div>
          <div class="text-[40px] text-[#F0FDF4] tracking-[-1px] mb-2">Stopwatch</div>
          <div class="text-[#A4B9AD] text-sm mb-[36px]">Make time for what matters.</div>
          <div class="flex justify-around py-[36px] px-4 border-y border-[#B5CBB226] ">
            <div class="flex flex-col items-center ">
              <div id="hour-display" class="text-[#EDF3E8] text-[56px] tracking-[-2px] font-mono font-thin ">00</div>
              <div class="text-[#9BAD9E] text-[9px] tracking-[2px] font-medium">HOURS</div>
            </div>
            <div class="text-[#5C7161] text-[40px] mt-2">:</div>
            <div class="flex flex-col items-center ">
              <div id="minute-display" class="text-[#EDF3E8] text-[56px] tracking-[-2px] font-mono font-thin ">00</div>
              <div class="text-[#9BAD9E] text-[9px] tracking-[2px] font-medium">MINUTES</div>
            </div>
            <div class="text-[#5C7161] text-[40px] mt-2">:</div>
            <div class="flex flex-col items-center ">
              <div id="second-display" class="text-[#EDF3E8] text-[56px] tracking-[-2px] font-mono font-thin ">00</div>
              <div class="text-[#9BAD9E] text-[9px] tracking-[2px] font-medium">SECONDS</div>
            </div>
          </div>
          <div class="flex gap-3 font-sm h-[48px] mt-8">
            <button type="button" id="start-button" class="cursor-pointer flex-2 flex justify-center items-center rounded-xl border border-[#FFFFFF1A] font-semibold text-sm text-[#102418] bg-[#B5CBB2] enabled:hover:bg-[#c5d9bd] disabled:cursor-not-allowed disabled:opacity-35">Start</button>
            <button type="button" id="pause-button" disabled class="cursor-pointer flex-1 flex justify-center items-center rounded-xl border border-[#FFFFFF1A] font-medium text-sm text-[#A4B9AD] enabled:hover:bg-white/10 enabled:hover:text-[#F0FDF4] disabled:cursor-not-allowed disabled:opacity-35 ">Pause</button>
            <button type="button" id="reset-button" disabled class="cursor-pointer flex-1 flex justify-center items-center rounded-xl border border-[#FFFFFF1A] font-medium text-sm text-[#A4B9AD] enabled:hover:bg-white/10 enabled:hover:text-[#F0FDF4] disabled:cursor-not-allowed disabled:opacity-35 ">Reset</button>
          </div>
          <div class="text-[#8AA294] text-xs flex justify-center mt-[20px]">A moment of focus. At your own pace.</div>
        </div>
      </div>
    </div>
  </body>
</html>
