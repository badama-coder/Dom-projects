<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/3566a1fbda.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="bg-[#18181B] size-[575px] rounded-3xl p-8 border border-[#27272A]">
          <div class="text-[#F4F4F5] font-semibold text-2xl mb-2">Reaction time</div>
          <div class="text-[#A1A1AA] text-sm mb-6">Wait for green, then click as quickly as you can.</div>
          <button id="button-game" type="button" class="w-lg h-[256px] bg-[#27272A] flex flex-col justify-center items-center rounded-2xl gap-3 cursor-pointer">
            <i id="icon" class="fa-solid fa-bullseye text-4xl"></i>
            <div id="text-ready" class="font-semibold text-2xl text-[#F4F4F5]">Ready when you are</div>
            <div id="text-click" class="text-sm text-[#F4F4F5]">Click to start</div>
          </button>
          <div class="flex gap-3 h-[84px] mt-6">
            <button class="flex-1 flex flex-col items-center justify-center rounded-xl bg-[#27272A] gap-1">
              <div id="last-attempt" class="text-[#D9F99D] text-2xl font-light">—</div>
              <div class="text-[#A1A1AA] text-xs">Last attempt</div>
            </button>
            <button class="flex-1 flex flex-col items-center justify-center rounded-xl bg-[#27272A] gap-1">
              <div id="best-attempt" class="text-[#D9F99D] text-2xl font-light">—</div>
              <div class="text-[#A1A1AA] text-xs">Best this session</div>
            </button>
          </div>
          <div class="text-[#A1A1AA] text-xs/5 mt-5 text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</div>
        </div>
      </div>
    </div>
  </body>
</html>
